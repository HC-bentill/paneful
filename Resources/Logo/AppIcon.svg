<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="1" stop-color="#FF4D6D"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="paneShadow" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#B0213F" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body inside 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <!-- design space 0..100 mapped onto the body -->
  <g transform="translate(100 100) scale(8.24)">
    <rect x="52" y="18" width="30" height="30" rx="7" fill="#fff" opacity=".35"/>
    <rect x="52" y="52" width="30" height="30" rx="7" fill="#fff" opacity=".35"/>
    <rect x="18" y="52" width="30" height="30" rx="7" fill="#fff" opacity=".35"/>
    <rect x="18" y="18" width="30" height="64" rx="7" fill="#fff" filter="url(#paneShadow)"/>
    <path d="M62 67 l7 -7 m0 0 v6 m0 -6 h-6" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
