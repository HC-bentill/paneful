name: Release

# Push a version tag to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# The release gets Paneful-<version>.dmg and Paneful.dmg. The landing page links to
#   https://github.com/HC-bentill/paneful/releases/latest/download/Paneful.dmg
# which always serves the newest release's Paneful.dmg.
#
# Signing and notarization run only when these repository secrets exist (Apple Developer Program):
#   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  password of that .p12
#   APPLE_ID                   Apple ID email used for notarization
#   APPLE_TEAM_ID              10-character team ID
#   APPLE_APP_PASSWORD         app-specific password for that Apple ID (appleid.apple.com)
# Without them, the app is signed with Paneful's self-signed certificate when these secrets exist
# (create it once with ./scripts/make-signing-cert.sh):
#   SELF_SIGNED_P12            base64 of build/signing/Paneful-Self-Signed.p12
#   SELF_SIGNED_P12_PASSWORD   its password
# That keeps the Accessibility permission across updates. With neither, the build is ad-hoc signed and users
# switch Paneful on again after each update. Either way users confirm the first launch in System Settings.

# To check signing on GitHub's runner without publishing anything, run it by hand (Actions → Release → Run
# workflow, or `gh workflow run release.yml --ref main`): it builds and checks the DMG and keeps it as a run
# artifact, but only a pushed tag creates a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_SELF_SIGNED: ${{ secrets.SELF_SIGNED_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Unit tests
        run: swift test

      - name: Import Developer ID certificate and notary credentials
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials paneful-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN"
          echo "NOTARY_PROFILE=paneful-notary" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Import the self-signed certificate
        if: env.HAS_DEVELOPER_ID != 'true' && env.HAS_SELF_SIGNED == 'true'
        env:
          P12: ${{ secrets.SELF_SIGNED_P12 }}
          P12_PASSWORD: ${{ secrets.SELF_SIGNED_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/self-signed.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/self-signed.p12"
          security import "$RUNNER_TEMP/self-signed.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/self-signed.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # codesign only looks in keychains on the user's search list, even with --keychain.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Trust the certificate for code signing, so codesign treats it as a valid identity (macOS can skip an
          # untrusted one). Best effort: signing by hash below may work without it.
          security find-certificate -c "Paneful Self-Signed" -p "$KEYCHAIN" > "$RUNNER_TEMP/self-signed.pem"
          sudo security authorizationdb write com.apple.trust-settings.admin allow \
            && sudo security add-trusted-cert -d -r trustRoot -p codeSign \
                 -k /Library/Keychains/System.keychain "$RUNNER_TEMP/self-signed.pem" \
            || echo "::warning::Could not mark the self-signed certificate as trusted for code signing"
          echo "Identities in the signing keychain:"
          security find-identity -p codesigning "$KEYCHAIN"
          # Sign by the certificate's SHA-1 hash: unambiguous, and found even when it isn't "valid".
          HASH="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/"Paneful Self-Signed"/ { print $2; exit }')"
          if [ -z "$HASH" ]; then
            echo "::error::The Paneful Self-Signed identity isn't in the keychain (check the SELF_SIGNED_P12 secrets)"
            exit 1
          fi
          echo "Signing identity: $HASH"
          echo "PANEFUL_SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "PANEFUL_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build DMG
        run: |
          # A tag names the version; a manual run uses the one in Info.plist.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"
          else VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/make-dmg.sh "$VERSION"

      - name: Check the signature
        run: |
          APP=build/release/Paneful.app
          codesign --verify --strict --verbose=2 "$APP"
          REQUIREMENT="$(codesign -dr - "$APP" 2>&1 | grep 'designated =>' || true)"
          echo "$REQUIREMENT"
          # With a certificate configured, an ad-hoc build (identity = cdhash) must never be published: users
          # would lose the Accessibility permission on every update again.
          if [ "$HAS_DEVELOPER_ID" = "true" ] || [ "$HAS_SELF_SIGNED" = "true" ]; then
            case "$REQUIREMENT" in
              *cdhash*) echo "::error::Signed ad-hoc although a signing certificate is configured"; exit 1 ;;
            esac
          fi

      - name: Keep the DMG (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Paneful-${{ env.VERSION }}-dmg
          path: build/Paneful-${{ env.VERSION }}.dmg

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Install"
            echo "1. Download **Paneful.dmg**, open it and drag **Paneful** onto **Applications**."
            if [ "$HAS_DEVELOPER_ID" != "true" ]; then
              echo "2. Open Paneful. macOS says it can't verify the developer: open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** (this build isn't notarized yet)."
              echo "3. Allow Paneful under **Privacy & Security → Accessibility** when asked."
              echo ""
              echo "**Updating from an earlier version?** Paneful removes the old version's Accessibility entry by itself and macOS asks again: just switch Paneful on. No need to remove it with – or relaunch."
            else
              echo "2. Open Paneful and allow it under **System Settings → Privacy & Security → Accessibility** when asked."
            fi
            echo ""
            echo "Requires macOS 27.2 or later (Apple silicon)."
            echo ""
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            "build/Paneful-$VERSION.dmg" "build/Paneful.dmg" \
            --title "Paneful $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
